<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2FA36B">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Owl & Crayon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen tablet app. Top bar, then one big view at a time. Single bright "classroom wall" look, chosen on purpose for kids. */
:root{
  --bg:#E9F3F8; --paper:#FFFFFF; --ink:#22305A; --ink-soft:#5A678C; --line:#CCDBE6;
  --leaf:#2FA36B; --leaf-soft:#D7F2E3; --sun:#FFC23D; --sun-soft:#FFF1CC;
  --coral:#F2604F; --coral-soft:#FDE0DB; --grape:#6D55D1; --grape-soft:#E6E0FA; --sky:#2E8BE6; --sky-soft:#D9EBFC;
  --display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
#app{min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;max-width:1100px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;line-height:1.1}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top .home{width:56px;height:56px;border-radius:18px;background:var(--paper);box-shadow:0 3px 0 var(--line);font-size:28px;display:grid;place-items:center}
.top .brand{font-family:var(--display);font-weight:800;font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.view{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hello h1{font-size:clamp(30px,5vw,46px)}
.hello p{margin:4px 0 0;color:var(--ink-soft);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.tile{border-radius:28px;padding:22px;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:0 6px 0 rgba(34,48,90,.15);transition:transform .12s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(34,48,90,.15)}
.tile .big{font-size:64px;line-height:1}
.tile h2{font-size:32px}
.tile p{margin:2px 0 0;font-weight:700;opacity:.85}
.t-math{background:var(--leaf);color:#fff}.t-art{background:var(--coral);color:#fff}.t-owl{background:var(--grape);color:#fff}
.pick{display:flex;align-items:center;gap:14px;background:var(--sun-soft);border:3px dashed var(--sun);border-radius:24px;padding:14px 18px;text-align:left;width:100%}
.pick .big{font-size:40px}
.pick b{font-family:var(--display);font-size:22px;display:block}
.stickers{display:flex;flex-wrap:wrap;gap:8px;font-size:34px;min-height:40px}
.stickers .empty{font-size:16px;color:var(--ink-soft);font-weight:700}
.section-title{font-size:22px;display:flex;align-items:center;gap:10px}
.small-link{font-weight:800;color:var(--ink-soft);text-decoration:underline;padding:8px;align-self:flex-start}
/* skill picker */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.skill{background:var(--paper);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:0 5px 0 var(--line);text-align:left}
.skill .ico{font-size:42px}
.skill b{font-family:var(--display);font-size:21px;line-height:1.1}
.lvl{display:flex;gap:3px;font-size:16px;letter-spacing:1px}
.lvl i{font-style:normal;opacity:.25}.lvl i.on{opacity:1}
.skill.rec{outline:4px solid var(--sun)}
.tag{font-size:13px;font-weight:800;background:var(--sun);border-radius:999px;padding:2px 10px}
/* question */
.qcard{background:var(--paper);border-radius:32px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:18px;align-items:center;box-shadow:0 6px 0 var(--line);position:relative}
.progress{display:flex;gap:6px;justify-content:center}
.progress i{width:28px;height:10px;border-radius:9px;background:var(--line)}
.progress i.done{background:var(--leaf)}.progress i.now{background:var(--sun)}
.prompt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.prompt h2{font-size:clamp(28px,5vw,44px);text-align:center}
.speak{width:52px;height:52px;border-radius:50%;background:var(--sky-soft);font-size:26px;flex:none}
.visual{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;min-height:60px;max-width:100%}
.objs{display:grid;grid-template-columns:repeat(5,auto);gap:4px 6px;font-size:clamp(30px,5vw,42px);line-height:1.1;padding:8px 10px;border-radius:18px;background:var(--bg)}
.objs span{position:relative;display:inline-block}
.objs span.gone{opacity:.25;filter:grayscale(1)}
.objs span.gone::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:4px;background:var(--coral);transform:rotate(-30deg);border-radius:3px}
.objs span sup{position:absolute;right:-6px;top:-6px;font:800 13px var(--body);background:var(--ink);color:#fff;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 4px}
.op{font-family:var(--display);font-size:52px;font-weight:800;color:var(--ink-soft)}
.bignum{font-family:var(--display);font-size:72px;font-weight:800;line-height:1}
.shape svg{width:min(180px,40vw);height:auto;display:block}
.pat{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.dot{width:44px;height:44px;border-radius:50%;display:inline-block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.dot.q{background:var(--bg)!important;border:4px dashed var(--ink-soft);box-shadow:none;display:grid;place-items:center;font:800 24px var(--display);color:var(--ink-soft)}
.unit{display:inline-flex;gap:8px;padding:6px;border:3px solid var(--sun);border-radius:30px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;width:100%;max-width:640px}
.choice{background:var(--sky-soft);border-radius:24px;min-height:96px;font-family:var(--display);font-weight:800;font-size:44px;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 #B5D3F2;padding:8px;transition:transform .1s}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #B5D3F2}
.choice.right{background:var(--leaf);color:#fff;box-shadow:0 5px 0 #1D7A4E}
.choice.wrong{background:var(--coral-soft);color:var(--coral);box-shadow:0 5px 0 #F4B3A9;animation:shake .35s}
.choice.txt{font-size:26px}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.explain{background:var(--sun-soft);border-radius:24px;padding:16px 18px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.explain p{margin:0;font-weight:800;font-size:22px;max-width:36ch}
.cheer{font-family:var(--display);font-size:36px;color:var(--leaf);height:44px}
/* done */
.done{align-items:center;text-align:center;justify-content:center}
.done .big{font-size:96px}
.done h1{font-size:48px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--ink);color:#fff;border-radius:20px;padding:16px 26px;font-family:var(--display);font-weight:800;font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.leaf{background:var(--leaf)}
/* art */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:10px 18px;border-radius:999px;background:var(--paper);font-weight:800;box-shadow:0 3px 0 var(--line)}
.tabs button[aria-pressed=true]{background:var(--coral);color:#fff;box-shadow:0 3px 0 #B8402F}
.idea{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:22px;padding:12px 14px;box-shadow:0 4px 0 var(--line);flex-wrap:wrap}
.idea p{flex:1;min-width:0;margin:0;font-weight:800;font-size:21px}
.studio{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.canvas-wrap{position:relative;flex:1;min-height:340px;background:#fff;border-radius:24px;box-shadow:0 5px 0 var(--line);overflow:hidden}
.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.mirror-line{position:absolute;top:0;bottom:0;left:50%;border-left:3px dashed var(--grape-soft);pointer-events:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.sw[aria-pressed=true]{outline:4px solid var(--ink);outline-offset:3px}
.tool{min-width:52px;height:52px;border-radius:16px;background:var(--paper);box-shadow:0 3px 0 var(--line);font-weight:800;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tool[aria-pressed=true]{background:var(--grape);color:#fff;box-shadow:0 3px 0 #4B37A6}
.size i{display:block;border-radius:50%;background:var(--ink)}
.mix{display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--paper);border-radius:28px;padding:22px;box-shadow:0 5px 0 var(--line)}
.pot{width:200px;height:200px;border-radius:50%;border:10px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;text-align:center;transition:background .4s;padding:20px}
.paints{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.paints button{width:76px;height:76px;border-radius:50%;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 4px 0 var(--line);font-weight:800;font-size:14px;color:#fff}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gallery img{width:100%;border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--line);display:block}
/* owl */
.owl-head{display:flex;align-items:flex-end;gap:14px}
.owl-face{font-size:84px;line-height:1;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{background:var(--paper);border-radius:26px 26px 26px 6px;padding:18px 20px;font-weight:800;font-size:22px;box-shadow:0 5px 0 var(--line);flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.bubble p{margin:0;line-height:1.35}
.ask{display:flex;gap:10px;flex-wrap:wrap}
.ask input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:700;padding:16px 18px;border-radius:20px;border:3px solid var(--line);background:var(--paper);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips button{background:var(--grape-soft);color:var(--grape);border-radius:999px;padding:10px 16px;font-weight:800;font-size:17px;text-align:left}
.helped{display:flex;gap:10px;align-items:center;font-size:16px;color:var(--ink-soft);flex-wrap:wrap}
.helped button{font-size:26px;background:var(--bg);border-radius:14px;padding:4px 12px}
/* parent */
.panel{background:var(--paper);border-radius:24px;padding:18px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:24px}
.ptable{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.ptable th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft)}
.bar{height:10px;border-radius:9px;background:var(--bg);min-width:80px;overflow:hidden}.bar i{display:block;height:100%;background:var(--leaf)}
.miss{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.miss textarea{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:10px;min-height:64px;resize:vertical;background:var(--paper);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800}
.field input{font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink);max-width:320px}
.note{color:var(--ink-soft);font-size:15px;margin:0;max-width:65ch}
.wide{overflow-x:auto}
/* confetti */
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;pointer-events:none;z-index:50;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){.owl-face,.confetti,.choice.wrong{animation:none}.confetti{display:none}}
.choices{gap:10px}
@media (max-width:520px){.top .brand{font-size:20px}.choice.txt{font-size:20px}.tile{min-height:150px}.tile .big{font-size:48px}.choice{font-size:36px;min-height:80px}.objs{grid-template-columns:repeat(5,auto)}}
/* ---- curriculum ---- */
.ptext{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.6vw,42px);text-align:center;line-height:1.15;text-wrap:balance}
.wordq{font-family:var(--body);font-weight:800;font-size:clamp(20px,3vw,26px);margin:0;max-width:34ch}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .12em;font-size:.8em}
.frac i{font-style:normal;padding:0 .15em}.frac i:first-child{border-bottom:.08em solid currentColor;padding-bottom:.05em}
.expr{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,48px)}
.mini .objs{font-size:20px;gap:1px 2px;padding:4px}
.choice .mini{display:flex}
.wide-shape svg{width:min(320px,70vw)}
.blocks{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.rod{display:grid;grid-template-rows:repeat(10,12px);gap:1px;background:#1D7A4E;padding:1px;border-radius:3px}
.rod i{display:block;width:14px;background:var(--leaf)}
.cubes{display:grid;grid-template-columns:repeat(2,14px);gap:3px}
.cube{width:14px;height:12px;background:var(--sun);border:1px solid #C9921A;border-radius:2px}
pre.column{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.15;margin:0;background:var(--bg);padding:10px 18px;border-radius:16px;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:1.4em;text-align:left;font-weight:700;font-size:19px;display:flex;flex-direction:column;gap:6px;max-width:40ch}
.qtools{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.help{height:44px;border-radius:999px;background:var(--grape-soft);color:var(--grape);font-weight:800;padding:0 14px;font-size:16px}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.world{border-radius:26px;padding:18px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 rgba(34,48,90,.18);min-height:150px}
.world .big{font-size:46px;line-height:1}
.world b{font-family:var(--display);font-size:26px;line-height:1}
.world .meter{height:10px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}.world .meter i{display:block;height:100%;background:#fff}
.world.locked{background:var(--line)!important;color:var(--ink-soft);box-shadow:none}
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumbs h1{font-size:34px}
.back{background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.lesson{display:flex;flex-direction:column;gap:14px}
.lstep{background:var(--paper);border-radius:22px;padding:16px;box-shadow:0 4px 0 var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;text-align:left}
.lstep p{flex:1;min-width:200px;margin:0;font-weight:800;font-size:21px}
.lstep .n{width:36px;height:36px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.lstep .visual{flex:none}
/* ---- art school ---- */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cat{background:var(--paper);border-radius:22px;padding:14px;text-align:left;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:4px}
.cat .ico{font-size:36px}.cat b{font-family:var(--display);font-size:20px;line-height:1.1}.cat span{font-size:15px;color:var(--ink-soft);font-weight:700}
.tools-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tool-tile{background:var(--coral);color:#fff;border-radius:22px;padding:14px;text-align:left;box-shadow:0 4px 0 #B8402F;display:flex;flex-direction:column;gap:2px}
.tool-tile .ico{font-size:34px}.tool-tile b{font-family:var(--display);font-size:20px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.lcard{background:var(--paper);border-radius:20px;padding:12px;text-align:left;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;gap:4px;position:relative}
.lcard .ico{font-size:34px}.lcard b{font-size:17px}
.lcard .lvl-tag{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;align-self:flex-start}
.lv1{background:var(--leaf-soft);color:#1D7A4E}.lv2{background:var(--sky-soft);color:#1D5FA0}.lv3{background:var(--grape-soft);color:var(--grape)}
.lcard.done::after{content:"✓";position:absolute;top:10px;right:12px;background:var(--leaf);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.lcard.locked{opacity:.45}
.lesson-view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;flex:1;min-height:0}
@media (max-width:760px){.lesson-view{grid-template-columns:1fr}}
.guide-card{background:var(--paper);border-radius:24px;padding:14px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.guide-card .stepno{font-weight:800;color:var(--ink-soft);font-size:15px}
.guide-card p{margin:0;font-weight:800;font-size:21px;min-height:2.6em}
.art-svg{width:100%;max-width:420px;aspect-ratio:1;align-self:center;display:block}
.art-svg *{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.art-svg .new *{stroke:var(--coral);stroke-width:4}
.art-svg .gd *{stroke:#9FB3C8;stroke-width:2;stroke-dasharray:5 5}
.art-svg .fold *{stroke-dasharray:7 5}
.art-svg .pt *{stroke:none;fill:inherit}
.art-svg text{font-family:var(--display);font-weight:800}
.art-svg .tx{stroke-width:2.5}
.stepnav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.trace-svg{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}
.trace-svg *{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.trace-svg .pt *{stroke:none;fill:inherit}.trace-svg .gd *{stroke-dasharray:5 5}
.canvas-wrap.sq{aspect-ratio:1;flex:none;width:100%;max-width:560px;align-self:center;min-height:0}
.sym{display:flex;gap:6px;flex-wrap:wrap}
/* pixel art */
.pixel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
@media (max-width:700px){.pixel{grid-template-columns:1fr}}
.pgrid{display:grid;gap:2px;background:var(--line);padding:2px;border-radius:12px;width:100%;max-width:520px;aspect-ratio:var(--ar,1);touch-action:none;user-select:none}
.pgrid b{background:#fff;border-radius:2px;position:relative;min-width:0}
.pgrid b.bad{outline:3px solid var(--coral);outline-offset:-3px}
.pgrid .lab{background:var(--bg);font:800 11px var(--body);display:grid;place-items:center;color:var(--ink-soft)}

<script>
(() => {

    .replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/g, ' ').replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, ' minus ').replace(/²/g, ' squared ').replace(/³/g, ' cubed ')
    .replace(/√/g, ' square root of ').replace(/%/g, ' percent').replace(/°/g, ' degrees').replace(/(^|[\s=(+-])\?(?=[\s=)]|$)/g, '$1 what ').replace(/[^\w\s.,!?'+=:-]/g, ' ').replace(/\s+/g, ' ');

/* ---------- shared pictures ---------- */
const THINGS = [['🍎','apples'],['⭐','stars'],['🐟','fish'],['🌸','flowers'],['🚗','cars'],['🐞','ladybugs'],['🍓','strawberries'],['🎈','balloons'],['🐥','chicks']];

const SHAPES = {
  circle: { sides: 0, svg: c => `<circle cx="50" cy="50" r="40" fill="${c}"/>` },
  oval: { sides: 0, svg: c => `<ellipse cx="50" cy="50" rx="45" ry="28" fill="${c}"/>` },
  square: { sides: 4, svg: c => `<rect x="14" y="14" width="72" height="72" rx="3" fill="${c}"/>`, pts: [[14,14],[86,14],[86,86],[14,86]] },
  rectangle: { sides: 4, svg: c => `<rect x="4" y="26" width="92" height="48" rx="3" fill="${c}"/>`, pts: [[4,26],[96,26],[96,74],[4,74]] },
  triangle: { sides: 3 }, pentagon: { sides: 5 }, hexagon: { sides: 6 },
  star: { sides: 10, svg: c => `<polygon points="${starPts()}" fill="${c}"/>` }

function starPts() { const p = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 19 : 46, a = -Math.PI / 2 + i * Math.PI / 5; p.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (52 + r * Math.sin(a)).toFixed(1)); } return p.join(' '); }
function shapeSVG(name, color, corners) {
  const s = SHAPES[name]; let body, pts = s.pts;
  if (s.svg) body = s.svg(color); else { pts = polyPts(s.sides); body = `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${color}"/>`; }
  let marks = '';
  if (corners && pts) marks = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="#22305A"/><text x="${p[0]}" y="${p[1] + 4}" font-size="9" font-weight="800" text-anchor="middle" fill="#fff">${i + 1}</text>`).join('');

const COLORS = [['#F2604F','red'],['#2E8BE6','blue'],['#FFC23D','yellow'],['#2FA36B','green'],['#6D55D1','purple'],['#FF8A2B','orange']];

/* ---------- early-years generators (used by Seedling Hill) ---------- */
const GEN = {
  count(L) {
    const max = [5, 8, 10, 15, 20][L - 1], n = rnd(1, max), [e, word] = pick(THINGS);
    return { prompt: `How many ${word}?`, speak: `How many ${word} can you count?`, visual: objs(n, e), choices: numChoices(n, 0, max + 3), answer: n,

      explain: pics ? `<div class="row"><div><div class="bignum">${a}</div>${objs(a, e)}</div><div><div class="bignum">${b}</div>${objs(b, e)}</div></div>` : `<span class="bignum">${a} ${a > b ? '>' : '<'} ${b}</span>`,

/* ---------- math curriculum: 5 worlds, every skill has a lesson and 5 levels ---------- */
// Included into the main script by build.py; uses the shared helpers defined above it.

const frac = (n, d) => `<span class="frac"><i>${n}</i><i>${d}</i></span>`;

// Build answer buttons: the answer plus distinct wrong options taken from a candidate list.

/* --- pictures --- */

const timeStr = (h, m) => `${h}:${String(m).padStart(2, '0')}`;

  let s = '';

function startMastery(id, age) { const w = MATH[id].world, aw = ageWorld(age); return w < aw ? 0.65 : w === aw ? 0.25 : 0; }
function freshState(age = 5) {
  const skills = {};
  for (const k in MATH) skills[k] = { m: startMastery(k, age), seen: 0, hist: [], ms: 0 };
  return { v: 2, name: '', age, stars: 0, streak: { n: 0, last: null }, skills, review: [], owlMisses: [], owlTaught: [], plays: { math: 0, art: 0, owl: 0 }, speak: true, unlockAll: false, art: { done: {}, pixel: 1, pixelDone: {} } };

const AVATARS = ['🦊', '🐼', '🐯', '🐸', '🦄', '🐙', '🐵', '🐨', '🐰', '🦁', '🐳', '🐞'];
function migrate(s) {
  for (const k in MATH) if (!s.skills[k]) s.skills[k] = { m: startMastery(k, s.age), seen: 0, hist: [], ms: 0 };
  s.art = s.art || { done: {}, pixel: 1, pixelDone: {} };
  s.review = (s.review || []).filter(r => MATH[r.skill]);
  s.pet = s.pet || { xp: Math.min(s.stars || 0, 150), wear: '', name: 'Hoot', seen: null };
  s.bestStreak = Math.max(s.bestStreak || 0, s.streak.n);
  s.questsDone = s.questsDone || 0;
  s.days = s.days || {};
  return s;
}

function toast(text) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
  t.textContent = text; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- daily quest: 3 small jobs a day, then a treasure chest ---------- */
function quest() {
  const d = today();
  if (!st.quest || st.quest.day !== d) {
    const n = dayNum(d), mathN = st.age <= 6 ? 5 : 8;
    const artJobs = [['art', 1, 'Finish an art lesson or save a drawing', '🖍️'], ['pixel', 1, 'Finish a pixel picture', '👾'], ['mix', 1, 'Make a new color in Mix colors', '🎨'], ['art', 1, 'Finish an art lesson or save a drawing', '🖍️']];
    const extra = dueReviews().length >= 2 ? ['review', 2, 'Practise 2 old questions', '🔁'] : [['owl', 1, 'Ask Owl a question', '🦉'], ['firsttry', 3, 'Get 3 right on the first try', '🎯']][n % 2];
    st.quest = { day: d, claimed: false, tasks: [['math', mathN, `Answer ${mathN} math questions`, '🔢'], artJobs[n % artJobs.length], extra].map(([k, need, t, ico]) => ({ k, need, t, ico, have: 0 })) };
    save();
  }
  return st.quest;
}
function questTick(k, by = 1) {
  const q = quest();
  q.tasks.forEach(t => { if (t.k === k && t.have < t.need) { t.have = Math.min(t.need, t.have + by); if (t.have === t.need) setTimeout(() => toast(`Quest job done: ${t.t}! ✅`), 400); } });
  save();
}
const questDone = q => q.tasks.every(t => t.have >= t.need);
function questCard() {
  const q = quest(), done = questDone(q);
  return `<div class="quest"><div class="quest-head"><b>Today's quest</b><span>${q.tasks.filter(t => t.have >= t.need).length} of 3</span></div>
    ${q.tasks.map((t, i) => `<button class="qtask${t.have >= t.need ? ' ok' : ''}" data-task="${i}"><span class="ico">${t.have >= t.need ? '✅' : t.ico}</span><span class="qt">${t.t}</span><span class="qn">${Math.min(t.have, t.need)}/${t.need}</span></button>`).join('')}
    ${q.claimed ? '<p class="note">Treasure opened! Come back tomorrow for a new quest.</p>' : `<button class="chest${done ? ' ready' : ''}" id="chest" ${done ? '' : 'aria-disabled="true"'}>${done ? '🎁 Open the treasure chest!' : '🔒 Finish all 3 to open the treasure chest'}</button>`}</div>`;
}
function wireQuest() {
  const q = quest();
  view.querySelectorAll('[data-task]').forEach(b => b.onclick = () => {
    const t = q.tasks[+b.dataset.task];
    ({ math: () => go(mathHome), firsttry: () => go(mathHome), review: () => go(play, 'review'), art: () => go(artHome), pixel: () => go(pixelHome), mix: () => go(mixTab), owl: () => go(owl) })[t.k]();
  });

  if (c) c.onclick = () => {
    if (!questDone(q)) { say('Finish all 3 quest jobs to open the treasure chest!'); return; }
    q.claimed = true; st.questsDone++; addStars(5); gainXP(25); save(); confetti(60); yay();
    say(`You opened the treasure chest! 5 bonus stars, and ${st.pet.name} loves it!`); toast('Treasure! +5 ⭐');
    go(home);
  };
}

/* ---------- daily activity log for the grown-ups' weekly summary ---------- */
function dayLog(k, n = 1) {
  const d = today(), x = st.days[d] = st.days[d] || { q: 0, ok: 0, stars: 0, art: 0 };
  x[k] = (x[k] || 0) + n;
  const keep = Object.keys(st.days).sort().slice(-60); for (const key in st.days) if (!keep.includes(key)) delete st.days[key];
}
function weekPanel() {
  const days = Array.from({ length: 7 }, (_, i) => { const t = new Date(); t.setDate(t.getDate() - 6 + i); const d = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); return [d, st.days[d] || { q: 0, ok: 0, stars: 0, art: 0 }, t.toLocaleDateString('en', { weekday: 'short' })]; });
  const sum = k => days.reduce((a, [, x]) => a + (x[k] || 0), 0), q = sum('q'), ok = sum('ok'), active = days.filter(([, x]) => x.q || x.art || x.stars).length;
  const max = Math.max(1, ...days.map(([, x]) => x.stars || 0));
  const tried = Object.keys(MATH).filter(k => st.skills[k].seen >= 5 && acc(k) != null);
  const best = tried.sort((a, b) => acc(b) - acc(a))[0], hard = [...tried].sort((a, b) => acc(a) - acc(b)).find(k => acc(k) < 0.7);
  return `<div class="panel"><h2>This week</h2>
    <div class="week" aria-label="Stars earned each day">${days.map(([d, x, w]) => `<div class="wk"><i style="height:${Math.round((x.stars || 0) / max * 70)}px"></i><b>${x.stars || 0}</b><span>${w}</span></div>`).join('')}</div>
    <p class="note">Played on ${active} of the last 7 days. ${q} math questions answered${q ? `, ${Math.round(ok / q * 100)}% right on the first try` : ''}. ${sum('art')} art lesson${sum('art') === 1 ? '' : 's'} or drawing${sum('art') === 1 ? '' : 's'} finished. ${sum('stars')} stars earned.</p>
    ${best ? `<p class="note">Strongest topic: ${MATH[best].ico} ${MATH[best].name} (${Math.round(acc(best) * 100)}% first try).${hard && hard !== best ? ` Worth practising together: ${MATH[hard].ico} ${MATH[hard].name} (${Math.round(acc(hard) * 100)}%).` : ''}</p>` : ''}</div>`;
}

/* ---------- adaptive engine: mastery per skill + spaced review ---------- */
const level = s => 1 + Math.min(4, Math.floor(st.skills[s].m * 5));
const BOXES = [1, 2, 4, 8, 16]; // days until the next review
const worldMastery = w => { const ks = worldSkills(w); return ks.reduce((a, s) => a + st.skills[s.id].m, 0) / ks.length; };
const worldOpen = w => st.unlockAll || w <= ageWorld(st.age) + 1 || worldMastery(w - 1) >= 0.5;
const openSkills = () => Object.keys(MATH).filter(k => worldOpen(MATH[k].world));
function learn(skill, firstTry, ms) {
  const s = st.skills[skill];
  s.seen++; s.hist = (s.hist || []).concat(firstTry ? 1 : 0).slice(-20);
  s.ms = s.ms ? Math.round(s.ms * 0.8 + ms * 0.2) : ms;
  s.m = clamp(s.m + (firstTry ? (ms < 10000 ? 0.06 : 0.035) : -0.07), 0, 1);
}
function addReview(skill, q) {
  if (st.review.some(r => r.q.prompt === q.prompt && String(r.q.answer) === String(q.answer))) return;
  st.review.push({ skill, q, box: 0, due: dayNum(today()) + 1 });
  if (st.review.length > 80) st.review.shift();
}
const dueReviews = () => st.review.filter(r => r.due <= dayNum(today()));
function acc(skill) { const h = st.skills[skill].hist || []; return h.length ? h.reduce((a, b) => a + b, 0) / h.length : null; }
function recommendSkill(world) {
  // Pick the skill in the "just right" zone: not mastered, not frustrating, least practised, easiest world first.
  const ks = world == null ? openSkills() : worldSkills(world).map(s => s.id);
  return ks.map(k => { const a = acc(k), s = st.skills[k]; return [k, (s.m >= 0.95 ? 3 : 0) + (a != null && a < 0.5 ? 1 : 0) + s.seen / 40 + MATH[k].world * 0.35 + Math.random() * 0.3]; })
    .sort((x, y) => x[1] - y[1])[0][0];
}
const artLevelOpen = lv => lv === 1 || st.unlockAll || st.age >= (lv === 2 ? 8 : 10) || LESSONS.filter(l => l.level === lv - 1 && st.art.done[l.id]).length >= 3;
const nextLesson = () => LESSONS.find(l => !st.art.done[l.id] && artLevelOpen(l.level));
function todaysPick() {
  if (dueReviews().length) return { kind: 'review', ico: '🔁', title: 'Quick review', text: `${dueReviews().length} to practise again` };
  if (st.plays.art < st.plays.math - 1) { const l = nextLesson(); if (l) return { kind: 'lesson', id: l.id, ico: l.ico, title: `Draw ${l.title.toLowerCase()}`, text: 'A step-by-step art lesson' }; }
  const k = recommendSkill();
  return { kind: 'skill', skill: k, ico: MATH[k].ico, title: MATH[k].name, text: `${WORLDS[MATH[k].world].name} · good one to play next` };
}
function bumpStreak() {
  const t = today(); if (st.streak.last === t) return;
  st.streak.n = st.streak.last && dayNum(t) - dayNum(st.streak.last) === 1 ? st.streak.n + 1 : 1; st.streak.last = t;
  st.bestStreak = Math.max(st.bestStreak || 0, st.streak.n);
}
function addStars(n) { st.stars += n; dayLog('stars', n); gainXP(n); bumpStreak(); save(); updateTop(); checkBadges(); }

  { k: ['chart', 'graph', 'bar chart', 'tally'], q: 'What is a bar chart?', a: 'A bar chart is a picture of numbers. Each bar shows how many. The tallest bar has the most!', v: () => chartSVG([['🍎', 3], ['🍌', 5], ['🍇', 2]]) },
  { k: ['average', 'mean'], q: 'What is an average?', a: 'The average is the fair share. Add all the numbers, then share the total equally. 2, 4 and 6 add to 12. 12 shared by 3 is 4!' },
  { k: ['minute', 'minutes', 'hour', 'hours', 'second', 'seconds'], q: 'How many minutes in an hour?', a: 'There are 60 minutes in an hour, and 60 seconds in a minute. A minute is about how long it takes to wash your hands really well.' },
  { k: ['week', 'days in a week', 'month', 'year', 'calendar'], q: 'How many days are in a week?', a: 'A week has 7 days: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday and Sunday. A year has 12 months and 365 days.' },
  { k: ['watercolor', 'watercolour', 'paint', 'painting', 'brush'], q: 'How do I paint with watercolors?', a: 'Use lots of water and a little paint. Paint light colors first and dark ones last. Let it dry before painting next to a wet part, or the colors will run together!' },
  { k: ['collage', 'glue', 'tear'], q: 'What is a collage?', a: 'A collage is a picture made by sticking pieces of paper, cloth or leaves together. Tear or cut shapes, move them around until you like it, then glue!' },
  { k: ['why math', 'why learn'], q: 'Why do we learn math?', a: 'Math helps us share snacks fairly, build things, cook, play games and so much more!' }
];
const STOP = new Set('what is a an the how do does i you me my can why are to of it this that there please tell about make with and or'.split(' '));
const norm = s => ' ' + s.toLowerCase().replace(/[^a-z0-9+×*÷/\-\s]/g, ' ').split(/\s+/).filter(Boolean).map(w => w.length > 3 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0, -1) : w).join(' ') + ' ';
const words = s => norm(s).trim().split(' ').filter(w => !STOP.has(w));
function mathAnswer(text) {
  const t = text.toLowerCase().replace(/×/g, 'x').replace(/÷/g, '/');
  let m = t.match(/(\d+)\s*(\+|plus|add|and|-|minus|take away|takeaway|x|times|\*|\/|divided by|shared by)\s*(\d+)/);
  if (m) {
    const a = +m[1], b = +m[3], op = m[2];
    if (a > 100000 || b > 100000) return null;
    const [e] = pick(THINGS);
    if (/\+|plus|add|and/.test(op)) return { a: `${a} plus ${b} is ${a + b}. Put them together and count them all!`, v: a + b <= 20 ? `${objs(a, e)}<span class="op">+</span>${objs(b, e)}` : `<span class="bignum">${a} + ${b} = ${a + b}</span>` };
    if (/^(x|times|\*)$/.test(op)) return { a: `${a} times ${b} is ${a * b}. That is ${a} groups of ${b}.`, v: a * b <= 25 ? `<div class="row">${Array.from({ length: a }, () => objs(b, e)).join('')}</div>` : `<span class="bignum">${a} × ${b} = ${a * b}</span>` };
    if (/\/|divided|shared/.test(op)) { if (!b) return { a: 'You cannot share things between zero friends. Dividing by zero does not work!' }; const q = Math.floor(a / b), r = a % b; return { a: `${a} divided by ${b} is ${q}${r ? ` with ${r} left over` : ''}. Share ${a} into ${b} equal groups.`, v: a <= 20 && b <= 5 ? `<div class="row">${Array.from({ length: b }, () => objs(q, e)).join('')}</div>` : `<span class="bignum">${a} ÷ ${b} = ${q}${r ? ' r ' + r : ''}</span>` }; }
    if (b > a) return { a: `${a} take away ${b} is ${a - b}. That is a negative number, below zero, like a very cold temperature!` };
    return { a: `${a} take away ${b} is ${a - b}. Cross out ${b} and count what is left.`, v: a <= 20 ? objs(a, e, { gone: b }) : `<span class="bignum">${a} − ${b} = ${a - b}</span>` };
  }
  m = t.match(/(after|before)\s+(\d+)/);
  if (m) { const n = +m[2], r = m[1] === 'after' ? n + 1 : n - 1; return { a: `The number ${m[1]} ${n} is ${r}.`, v: `<span class="bignum">${m[1] === 'after' ? n + ' → ' + r : r + ' ← ' + n}</span>` }; }
  return null;
}
/* Online Owl (optional): a grown-up connects the family's own server, which keeps the API key off this tablet. */
const onlineCfg = () => store.get('online', { url: '', code: '', on: false });
const onlineReady = () => { const c = onlineCfg(); return c.on && c.url && c.code && navigator.onLine !== false; };
function askOnline(q, path = '/ask') {
  const c = onlineCfg(), ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
  return fetch(c.url.replace(/\/+$/, '') + path, { method: 'POST', signal: ctl.signal, headers: { 'Content-Type': 'application/json', 'X-Owl-Code': c.code }, body: JSON.stringify({ question: q, age: st.age }) })
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status === 401 ? 'code' : 'http ' + r.status))).finally(() => clearTimeout(t));
}
// Every online answer is saved, so the same question works offline next time.
function owlRemember(q, a) { const c = store.get('owlCache', []).filter(x => x.q !== norm(q)); c.unshift({ q: norm(q), text: q, a, at: today() }); store.set('owlCache', c.slice(0, 300)); }
const owlForget = q => store.set('owlCache', store.get('owlCache', []).filter(x => x.q !== norm(q)));
function owlFind(text) {
  const mth = mathAnswer(text); if (mth) return mth;
  const n = norm(text);
  const hit = store.get('owlCache', []).find(x => x.q === n); if (hit) return { a: hit.a, v: '' };
  let best = null, bestScore = 0;
  for (const e of [...st.owlTaught.map(t => ({ k: words(t.q), a: t.a, taught: true })), ...KB]) {
    let s = 0;
    for (const k of e.k) { const nk = norm(k); if (n.includes(nk)) s += nk.trim().split(' ').length; }
    // A grown-up's answer wins when most of its question's words appear.
    if (e.taught) s = e.k.length && s / e.k.length >= 0.6 ? 2 + s : 0;
    if (s > bestScore) { bestScore = s; best = e; }
  }
  return best ? { a: best.a, v: best.v ? best.v() : '' } : null;
}
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
function owl() {
  st.plays.owl++; save();
  const chips = shuffle(KB).slice(0, 4).map(e => e.q).concat(['What is 3 plus 4?']);
  view.innerHTML = `<div class="owl-head"><div class="owl-face" aria-hidden="true">🦉</div>
      <div class="bubble" id="bub" aria-live="polite"><p>Hoo hoo! Ask me about numbers, shapes, colors or drawing.</p></div></div>
    <form class="ask" id="askf">${Rec ? '<button type="button" class="btn mic" id="mic" aria-label="Talk to Owl">🎤</button>' : ''}<input id="askq" autocomplete="off" placeholder="Type your question…" aria-label="Your question"><button class="btn" type="submit" style="background:var(--grape)">Ask</button></form>
    <div class="chips">${chips.map(c => `<button data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  sayScreen('Hoo hoo! Ask me about numbers, shapes, colors or drawing.' + (Rec ? ' Tap the microphone to talk to me.' : ''));
  let lastQ = '';
  const ask = q => {
    q = q.trim(); if (!q) return;
    lastQ = q; questTick('owl');
    const r = owlFind(q), bub = $('#bub');
    if (!r && onlineReady()) {
      bub.innerHTML = '<p>Hmm, let me think… 🤔</p>';
      askOnline(q).then(d => { if (!d.answer) throw new Error('empty'); owlRemember(q, d.answer); if ($('#bub') === bub) show({ a: d.answer, v: '' }); })
        .catch(() => { if ($('#bub') === bub) miss(); });
      return;
    }
    r ? show(r) : miss();
  };
  function show(r) {
    const bub = $('#bub');
    bub.innerHTML = `<p>${esc(r.a)}</p>${r.v ? `<div class="visual">${r.v}</div>` : ''}<div class="helped">Did that help? <button data-h="1" aria-label="yes">👍</button><button data-h="0" aria-label="no">👎</button></div>`;
      say(r.a);
      bub.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
        if (b.dataset.h === '0') { owlForget(lastQ); logMiss(lastQ, 'did not help'); bub.querySelector('.helped').textContent = 'Thanks! I will ask a grown-up to teach me a better answer.'; say('Thanks! I will ask a grown-up to teach me.'); }
        else { bub.querySelector('.helped').textContent = 'Yay! 🦉'; yay(); }
      });
  }
  function miss() {
    logMiss(lastQ, 'no answer');
    $('#bub').innerHTML = `<p>Ooh, that is a great question! I don't know yet. I saved it so a grown-up can teach me.</p>`;
    say('Ooh, that is a great question! I do not know yet. I saved it so a grown-up can teach me.');
  }
  $('#askf').onsubmit = e => { e.preventDefault(); ask($('#askq').value); $('#askq').value = ''; };
  view.querySelectorAll('[data-q]').forEach(b => b.onclick = () => ask(b.dataset.q));
  if (Rec) $('#mic').onclick = e => {
    const btn = e.currentTarget, bub = $('#bub');
    let r; try { r = new Rec(); } catch (err) { bub.innerHTML = '<p>My ears are not working here. Can a grown-up type it for you?</p>'; return; }
    r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 1;
    try { speechSynthesis.cancel(); } catch (err) {}
    btn.classList.add('on'); bub.innerHTML = '<p>I am listening… 👂</p>';
    r.onresult = ev => { const t = ev.results[0][0].transcript; $('#askq').value = t; ask(t); $('#askq').value = ''; };
    r.onerror = ev => { bub.innerHTML = `<p>${navigator.onLine === false || ev.error === 'network' ? 'I can only hear you when the internet is on. You can type, or tap a question below!' : 'I did not hear that. Tap the microphone and try again!'}</p>`; };
    r.onend = () => btn.classList.remove('on');
    try { r.start(); } catch (err) { btn.classList.remove('on'); }
  };
}
function logMiss(q, why) { if (!st.owlMisses.some(m => m.q === q)) st.owlMisses.unshift({ q, why, at: today() }); st.owlMisses = st.owlMisses.slice(0, 40); save(); }

/* ---------- grown-ups corner ---------- */
function gate() {
  const a = rnd(6, 9), b = rnd(6, 9);
  view.innerHTML = `<div class="panel" style="max-width:520px"><h2>For grown-ups</h2><p class="note">Answer to continue: what is ${a} × ${b}?</p>
    <form id="gf" class="ask"><input id="ga" inputmode="numeric" aria-label="Answer" autocomplete="off"><button class="btn" type="submit">Go</button></form><p class="note" id="gm"></p></div>`;
  $('#gf').onsubmit = e => { e.preventDefault(); +$('#ga').value === a * b ? go(parent) : ($('#gm').textContent = 'Not quite. Try again.'); };
}
function parent() {
  const rows = WORLDS.map((w, wi) => `<tr><th colspan="6" style="padding-top:16px">${w.ico} ${w.name} (ages ${w.ages})${worldOpen(wi) ? '' : ' · locked'}</th></tr>` + worldSkills(wi).map(s => { const k = s.id, x = st.skills[k], a = acc(k);
    return `<tr><td>${s.ico} ${s.name}</td><td>${level(k)} / 5</td><td><div class="bar"><i style="width:${Math.round(x.m * 100)}%"></i></div></td><td>${a == null ? '–' : Math.round(a * 100) + '%'}</td><td>${x.ms ? (x.ms / 1000).toFixed(1) + 's' : '–'}</td><td>${x.seen}</td></tr>`; }).join('')).join('');
  const artDone = [1, 2, 3].map(lv => `${LEVEL_NAMES[lv]}: ${LESSONS.filter(l => l.level === lv && st.art.done[l.id]).length} of ${LESSONS.filter(l => l.level === lv).length}`).join(' · ');
  view.innerHTML = `<h1 style="font-size:36px">Grown-ups corner</h1><p class="note">Showing ${profileOf(pid).avatar} ${esc(st.name || 'Player')}. Switch players under Players below.</p>
    ${weekPanel()}
    <div class="panel"><h2>Math progress</h2><p class="note">Each topic has 5 levels. It gets harder after answers that are right on the first try, and easier after mistakes. Missed questions come back for review after 1, 2, 4, 8 and 16 days. ${st.review.length} questions are in review, ${dueReviews().length} due today. A new world opens when your child reaches 50% in the world before it.</p>
      <div class="wide"><table class="ptable"><thead><tr><th>Topic</th><th>Level</th><th>Mastery</th><th>Right first try (last 20)</th><th>Avg time</th><th>Answered</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="panel"><h2>Art progress</h2><p class="note">${artDone}. Pixel art level ${st.art.pixel} of 5. ${gallery.length} saved pictures.</p></div>
    <div class="panel"><h2>Teach Owl</h2><p class="note">Questions Owl could not answer well. Write a short, simple answer and Owl will use it next time, even offline.</p>
      <div id="misses">${st.owlMisses.length ? st.owlMisses.map((m, i) => `<div class="miss"><b>“${esc(m.q)}”</b><span class="note">${m.at} · ${m.why}</span>
        <textarea id="t${i}" placeholder="A simple answer a child can understand"></textarea><div class="row" style="justify-content:flex-start"><button class="btn leaf" data-teach="${i}" style="font-size:18px;padding:10px 18px">Teach Owl</button><button class="btn alt" data-skip="${i}" style="font-size:18px;padding:10px 18px">Dismiss</button></div></div>`).join('') : '<p class="note">Nothing waiting. Owl has answered everything so far.</p>'}</div>
      ${st.owlTaught.length ? `<p class="note">Owl has learned ${st.owlTaught.length} answer${st.owlTaught.length > 1 ? 's' : ''} from you.</p>` : ''}</div>
    ${playersPanel()}
    <div class="panel"><h2>Online Owl <span class="tag">optional</span></h2>
      <p class="note">Owl answers many questions offline. With the Online Owl server (see the server folder in the app's code), Owl can answer any question using Claude. The API key stays on your server, never on this tablet. Every answer is saved here, so it also works offline next time.</p>
      <label class="field" for="ou">Server address<input id="ou" value="${esc(onlineCfg().url)}" placeholder="https://owl-crayon-owl.yourname.workers.dev" autocomplete="off" inputmode="url"></label>
      <label class="field" for="oc">Access code<input id="oc" value="${esc(onlineCfg().code)}" autocomplete="off"></label>
      <label class="field" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" id="oo" ${onlineCfg().on ? 'checked' : ''} style="width:26px;height:26px"> Use Online Owl when the internet is on</label>
      <div class="row" style="justify-content:flex-start"><button class="btn" id="oSave">Save and test</button></div><p class="note" id="om" aria-live="polite"></p>
      ${store.get('owlCache', []).length ? `<details><summary class="note">Questions Online Owl answered (${store.get('owlCache', []).length})</summary>${store.get('owlCache', []).slice(0, 20).map(x => `<div class="miss"><b>“${esc(x.text)}”</b><span class="note">${x.at}</span><p>${esc(x.a)}</p></div>`).join('')}</details>` : ''}</div>
    <div class="panel"><h2>Settings</h2>
      <label class="field" for="nm">Child's name<input id="nm" value="${esc(st.name)}" autocomplete="off"></label>
      <label class="field" for="ag">Age<input id="ag" type="number" min="3" max="16" value="${st.age}"></label>
      <label class="field" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" id="sp" ${st.speak ? 'checked' : ''} style="width:26px;height:26px"> Read everything aloud</label>
      <label class="field" style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" id="ua" ${st.unlockAll ? 'checked' : ''} style="width:26px;height:26px"> Open every world, lesson and level</label>
      <div class="row" style="justify-content:flex-start"><button class="btn" id="saveS">Save settings</button><button class="btn alt" id="reset">Reset all progress</button></div><p class="note" id="sm" aria-live="polite"></p></div>
    <div class="panel"><h2>About and privacy</h2>
      <p class="note">Owl &amp; Crayon works without the internet. Progress, drawings and Owl's answers are saved only in this browser on this device. There are no ads, no tracking and no accounts, and nothing is sent anywhere unless you switch on Online Owl.</p>
      <p class="note">With Online Owl on, only the question your child asks and their age go to your Online Owl server, which asks Claude (by Anthropic) for a short, child-friendly answer. Names and progress are never sent. You can read every answer above, and turn it off at any time.</p>
      <p class="note">The microphone button uses the browser's own speech recognition, which may send the recording to the browser maker (for example Google or Apple) to turn it into text. Typing works without it.</p>
      <p class="note">Version 2026-10-20 10:32 UTC</p></div>`;
  view.querySelectorAll('[data-teach]').forEach(b => b.onclick = () => {
    const i = +b.dataset.teach, ans = $('#t' + i).value.trim(); if (!ans) return;
    owlForget(st.owlMisses[i].q); st.owlTaught.push({ q: st.owlMisses[i].q, a: ans }); st.owlMisses.splice(i, 1); save(); go(parent);
  });
  wirePlayers();
  $('#oSave').onclick = () => {
    const cfg = { url: $('#ou').value.trim(), code: $('#oc').value.trim(), on: $('#oo').checked }, m = $('#om');
    if (cfg.url && !/^https:\/\//.test(cfg.url)) { m.textContent = 'The address must start with https://'; return; }
    store.set('online', cfg);
    if (!cfg.on || !cfg.url) { m.textContent = 'Saved. Owl is using offline answers only.'; return; }
    m.textContent = 'Saved. Testing the connection…';
    askOnline('', '/check').then(() => { m.textContent = 'Connected! Owl can now answer new questions online.'; })
      .catch(e => { m.textContent = e.message === 'code' ? 'The server says the access code is wrong.' : 'Could not reach the server. Check the address and the internet connection.'; });
  };
  view.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { st.owlMisses.splice(+b.dataset.skip, 1); save(); go(parent); });
  $('#saveS').onclick = () => {
    const age = clamp(+$('#ag').value || 5, 3, 16);
    if (age !== st.age) for (const k in MATH) if (st.skills[k].seen === 0) st.skills[k].m = startMastery(k, age);
    st.name = $('#nm').value.trim().slice(0, 20); st.age = age; st.speak = $('#sp').checked; st.unlockAll = $('#ua').checked; save(); updateTop(); $('#sm').textContent = 'Saved.';
  };

    const keep = { name: st.name, age: st.age }; st = migrate(freshState(keep.age)); st.name = keep.name; gallery = []; saveGallery(); save(); updateTop(); go(parent);
  };
}

/* ---------- start ---------- */
updateTop();
go(profiles.length > 1 ? whoView : home);
if (location.hash === "#selftest") window.__owl = { MATH, LESSONS, lessonSVG, PICS, get st() { return st; }, get profiles() { return profiles; }, quest, questTick, gainXP, petStage, go, home };
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  try {
    // A new version installs in the background; offer a tap to switch rather than reloading mid-game.
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || document.getElementById('updBar')) return;
      const bar = document.createElement('button'); bar.id = 'updBar'; bar.textContent = '✨ A new version is ready. Tap to update!';
      bar.onclick = () => location.reload(); document.body.appendChild(bar);
    });
    navigator.serviceWorker.register('sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  } catch (e) {}
}
})();
</script>
